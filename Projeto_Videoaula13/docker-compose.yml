name: videoaula13
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PGDATABASE:?Configure .env}
      POSTGRES_USER: ${PGUSER:?Configure .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Configure .env}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  dados_postgres:
